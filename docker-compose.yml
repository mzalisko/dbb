services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug-mode.ini
    ports:
      - "8000:8080"
    environment:
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - PHP_OPCACHE_REVALIDATE_FREQ=0
      - XDEBUG_MODE=off
      - AUTORUN_ENABLED=true
      - AUTORUN_LARAVEL_MIGRATION=true
      - AUTORUN_LARAVEL_STORAGE_LINK=true
      - SSL_MODE=off
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ddbv2

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: ddbv2
      MYSQL_USER: ddbv2
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ddbv2

volumes:
  mysql_data:

networks:
  ddbv2:
    driver: bridge
