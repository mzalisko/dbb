; Dev performance on a Windows bind mount.
; Every stat() through the Docker file-share is expensive — cache aggressively
; but keep validate_timestamps=1 so edits still show up (within revalidate_freq).

; Path resolution cache: hundreds of files per request resolve once, not every time.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Opcache headroom so the whole app + vendor stays compiled.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; Don't waste time checking timestamps more than once per 2s per file.
; (PHP_OPCACHE_REVALIDATE_FREQ env also sets this — keep in sync.)
opcache.revalidate_freq = 2
